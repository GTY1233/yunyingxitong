name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      # 阶段 0：先只对新代码 + 配置做严格检查；存量文件做一次性 `npm run fix` 后再纳入全量范围。
      - name: Lint & format (new code + config)
        run: npx biome ci tests biome.json package.json tsconfig.json vitest.config.mjs ecosystem.config.cjs
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npm test
