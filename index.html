<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 电商自动运营系统 MVP</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">AI</div>
          <div>
            <strong>运营系统</strong>
            <span>商品驱动工作台</span>
          </div>
        </div>

        <nav class="nav nav-primary" aria-label="主导航">
          <button class="nav-item active" data-view="dashboard">今日工作台</button>
          <button class="nav-item" data-view="products">商品运营台</button>
          <button class="nav-item" data-view="publish">发布任务</button>
        </nav>

        <nav class="nav nav-secondary" aria-label="更多功能">
          <span class="nav-label">系统管理</span>
          <button class="nav-item" data-view="tasks">生成任务</button>
          <button class="nav-item" data-view="workflows">自动化流程</button>
          <button class="nav-item" data-view="assets">成品库</button>
          <button class="nav-item" data-view="accounts">平台账号</button>
          <button class="nav-item" data-view="inventory">库存</button>
          <button class="nav-item" data-view="data">数据</button>
        </nav>

        <div class="sidebar-card">
          <span class="label">当前阶段</span>
          <strong>推荐路径</strong>
          <p>今日工作台 → 商品运营台 → 发布任务。高级功能放在系统管理。</p>
        </div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">先处理待办，再围绕商品完成生成、确认、发布</p>
            <h1 id="pageTitle">今日工作台</h1>
          </div>
          <div class="top-actions" id="topActions"></div>
        </header>

        <section id="viewRoot" class="view-root" aria-live="polite"></section>
      </main>
    </div>

    <div id="toast" class="toast" role="status"></div>

    <script src="./app.js?v=1.5.0" defer></script>
  </body>
</html>
